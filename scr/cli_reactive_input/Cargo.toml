[package]
name = "cli_reactive_input"
version = "0.1.0"
edition = "2021"

[dependencies]


[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["fs", "term"] }

[target.'cfg(windows)'.dependencies]
