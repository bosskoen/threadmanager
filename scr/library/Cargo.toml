[package]
name = "library"
version = "0.1.0"
edition = "2021"

[features]
default = []
GPIO = ["rppal"]
led = []

[dependencies]
chrono = "0.4"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.45.1", features = ["rt", "macros", "sync"]}
reqwest = {version = "0.12.9", features = ["blocking"] }
retry = { version = "2.0.0"}
url = { version = "2.5.4"}
toml = "0.8.19"
atty = "0.2"
lazy_static = "1.4.0"
rustyline = { version = "16.0.0"}

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["consoleapi", "fileapi", "winbase", "handleapi"] }

[target.'cfg(unix)'.dependencies]
libc = {version = "0.2"}
rppal = {version = "0.22.1", optional = true}